<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时语音转录</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <style>
        :root {
            --sidebar-width: 300px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 极致极简滚动条：平时不显示，仅在触发滚动时显示极细暗色条 */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden; /* 防止滑动时由于越界产生底部恶心滚动条 */
        }
        
        .sidebar {
            width: var(--sidebar-width);
            background: #252525;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-left: 0;
            flex-shrink: 0;
        }
        
        .sidebar.collapsed {
            margin-left: calc(-1 * var(--sidebar-width));
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        .sidebar-top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 500;
        }

        .history-count {
            font-size: 11px;
            color: #666;
        }

        .empty-hint {
            padding: 30px 10px;
            text-align: center;
            color: #555;
            font-size: 12px;
        }

        .skeleton {
            padding: 12px;
            background: #2a2a2a;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .skeleton-line {
            height: 10px;
            background: #333;
            border-radius: 3px;
            margin-bottom: 7px;
        }

        .skeleton-line:last-child {
            width: 55%;
            margin-bottom: 0;
        }
        
        .search-wrap {
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 8px 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 13px;
            font-family: inherit;
        }

        .search-box::-webkit-search-cancel-button {
            filter: invert(0.6);
            cursor: pointer;
        }

        .search-count {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 10px;
            color: #666;
            pointer-events: none;
        }

        .search-count.no-hit {
            color: #8a5a5a;
        }
        
        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid #333;
        }
        
        .export-btn {
            width: 100%;
            padding: 10px;
            background: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 10px 40px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
        }
        
        .settings-btn {
            padding: 8px 16px;
            background: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .icon-toggle-btn {
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }
        
        .recorder-section {
            max-width: 850px; /* 拓宽主工作区，避免小气 */
            margin: 0 auto;
        }
        
        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .mic-button {
            width: 240px; /* 暴增 3 倍体积 */
            height: 240px;
            border-radius: 50%;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            flex-shrink: 0;
            /* 严格禁忌：已完全剔除鼠标 transition 过渡微动效 */
        }

        .mic-button.recording {
            background: #d9234a; /* 高级的西瓜红 */
            border-color: #d9234a;
        }
        
        .mic-icon {
            width: 96px; /* 同步放大内核 3 倍 */
            height: 96px;
            fill: #e0e0e0;
        }

        .mic-note {
            margin-top: 18px;
            font-size: 12px;
            color: #666;
        }
        
        .visualizer-container {
            margin: 20px 0;
            height: 80px;
            background: #2a2a2a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 空闲时不占用空间，也不显示一排没意义的灰条 */
        .visualizer-container.idle {
            display: none;
        }
        
        .recording-info {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 12px;
            color: #888;
        }
        
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 100%;
        }
        
        .bar {
            width: 4px;
            background: #444;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .bar.active {
            background: #d9234a;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 16px;
            min-height: 22px;
        }

        .status {
            flex: 1;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .status.recording {
            color: #d9234a;
        }

        .stats {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }

        /* 空闲时不显示统计，避免出现无意义的 0 */
        .stats.idle {
            display: none;
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .stat-label {
            color: #555;
        }

        .stat-value {
            color: #999;
            font-family: ui-monospace, Consolas, monospace;
        }

        .warmup-hint {
            display: none;
            text-align: center;
            font-size: 12px;
            color: #8a6d3b;
            background: #2a2418;
            border: 1px solid #3d3524;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
        }

        .model-banner {
            background: #222;
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }

        .model-banner.ready {
            display: none;
        }

        .model-banner.error {
            border-color: #4a2c2c;
            background: #241c1c;
        }

        .model-banner-title {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 12px;
        }

        .model-banner.error .model-banner-title {
            color: #ff8080;
        }

        .model-banner-bar {
            height: 3px;
            background: #2a2a2a;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .model-banner-fill {
            height: 100%;
            width: 20%;
            background: #d9234a;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .model-banner.error .model-banner-fill {
            background: #a33;
        }

        .model-banner-desc {
            font-size: 12px;
            color: #666;
        }

        .model-banner-desc b {
            color: #999;
            font-weight: 500;
        }

        .action-btn.copied {
            background: #2e5d34;
            color: #cfe8d2;
        }
        
        .transcripts {
            margin-top: 30px;
        }

        .empty-stage {
            border: 1px dashed #2f2f2f;
            border-radius: 12px;
            padding: 56px 24px;
            text-align: center;
        }

        .empty-stage-title {
            font-size: 15px;
            color: #555;
            margin-bottom: 8px;
        }

        .empty-stage-desc {
            font-size: 12px;
            color: #444;
        }
        
        .transcript-item {
            margin-bottom: 24px;
            padding: 25px 35px; /* 加大内部留白，形成真正的“留白高级区” */
            background: #222; /* 更克制深沉的纯净黑底 */
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4); /* “悬浮面板”的阻尼阴影 */
            border: 1px solid #2f2f2f; /* 极细分隔线 */
            line-height: 1.8; /* 让文字呼吸 */
        }
        
        .transcript-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .transcript-time {
            font-size: 12px;
            color: #888;
        }
        
        .transcript-actions {
            display: flex;
            gap: 8px;
        }
        
        .action-btn {
            padding: 4px 10px;
            background: #3a3a3a;
            color: #ccc;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .transcript-text {
            color: #dcdcdc;
            font-size: 15px;
            margin-top: 5px;
            /* 转录稿必须能自由选中复制，但禁止子 span 各自成块导致粘出多余换行 */
            user-select: text;
            -webkit-user-select: text;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
            display: none;
            background: #2a1c1c;
            border: 1px solid #4a2c2c;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
        }

        button {
            padding: 12px;
            background: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid #d9234a;
            outline-offset: 2px;
        }
        
        .session-group {
            margin-bottom: 12px;
            background: #2a2a2a;
            border-radius: 6px;
            overflow: hidden;
        }
        
        .session-header {
            padding: 12px;
            background: #2f2f2f;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .session-info {
            flex: 1;
        }
        
        .session-title {
            font-size: 13px;
            color: #e0e0e0;
            margin-bottom: 4px;
        }
        
        .session-meta {
            font-size: 11px;
            color: #888;
        }
        
        .session-actions {
            display: flex;
            gap: 8px;
        }
        
        .session-delete-btn {
            padding: 4px 10px;
            background: #3a3a3a;
            color: #ccc;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }
        
        .session-segments {
            display: none;
            padding: 8px;
        }
        
        .session-segments.expanded {
            display: block;
        }
        
        .segment-item {
            padding: 10px;
            background: #333;
            border-radius: 4px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        
        .segment-item:hover {
            background: #3a3a3a;
        }
        
        .segment-index {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }
        
        .segment-text {
            font-size: 12px;
            color: #ccc;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 25px 30px;
            max-width: 360px; /* 收敛宽度，增加紧凑感 */
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); /* 增加一点阻尼感的深沉阴影 */
        }
        
        .modal-header {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 25px;
            border-bottom: 1px solid #3a3a3a;
            padding-bottom: 15px;
        }
        
        .setting-item {
            margin-bottom: 20px;
        }
        
        .setting-label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 8px;
        }
        
        .setting-select {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #4a4a4a;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 14px;
        }
        
        .setting-value {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #333;
            border-radius: 6px;
            color: #8a8a8a;
            font-size: 14px;
            font-family: ui-monospace, Consolas, monospace;
        }
        
        .setting-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .setting-checkbox input {
            width: 18px;
            height: 18px;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .confirm-content {
            max-width: 400px;
        }

        .confirm-text {
            font-size: 14px;
            line-height: 1.7;
            color: #ccc;
        }

        .danger-btn {
            background: #5d2530;
            border-color: #7d3543;
            color: #f0c8cf;
        }

        .audio-player {
            margin-top: 10px;
            width: 100%;
        }
        
        audio {
            width: 100%;
            height: 32px;
        }

        /* ---------- 响应式：窄屏折叠侧栏并缩小主控件 ---------- */
        @media (max-width: 860px) {
            :root {
                --sidebar-width: 240px;
            }

            .header {
                padding: 10px 16px;
            }

            h1 {
                font-size: 16px;
            }

            .content {
                padding: 20px 16px;
            }

            .mic-button {
                width: 168px;
                height: 168px;
            }

            .mic-icon {
                width: 68px;
                height: 68px;
            }

            .transcript-item {
                padding: 18px 20px;
            }

            .modal-content {
                max-width: 92vw;
            }

            .stats {
                display: none;
            }
        }

        @media (max-width: 560px) {
            /* 窄屏下侧栏改为覆盖层，不再挤压正文 */
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                z-index: 900;
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            }

            .sidebar.collapsed {
                margin-left: calc(-1 * var(--sidebar-width) - 8px);
            }

            /* 覆盖层展开时点击正文关闭 */
            .sidebar-scrim {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                z-index: 850;
            }

            .sidebar-scrim.show {
                display: block;
            }

            .mic-button {
                width: 132px;
                height: 132px;
            }

            .mic-icon {
                width: 54px;
                height: 54px;
            }
        }

        .sidebar-scrim {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .sidebar {
                transition: none;
            }

            .bar {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar-scrim" id="sidebarScrim"></div>
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-top">
                    <span class="sidebar-title">历史记录</span>
                    <span class="history-count" id="historyCount"></span>
                </div>
                <div class="search-wrap">
                    <input type="search" class="search-box" id="searchBox" placeholder="搜索转录内容...">
                    <span class="search-count" id="searchCount"></span>
                </div>
            </div>
            <div class="history-list" id="historyList"></div>
            <div class="sidebar-footer">
                <button class="export-btn" id="exportAllBtn">导出全部记录</button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button class="icon-toggle-btn" id="toggleSidebarBtn" title="折叠/展开历史记录">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>
                    <h1>实时语音转录</h1>
                </div>
                <button class="settings-btn" id="settingsBtn">设置</button>
            </div>
            
            <div class="content">
                <div class="recorder-section">
                    <div class="mic-section">
                        <button class="mic-button" id="micButton" title="点击开始或结束录音（空格键同效）">
                            <svg class="mic-icon" viewBox="0 0 24 24">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                        </button>
                        <div class="mic-note">识别出的文字直接显示在下方</div>
                    </div>
                    
                    <div class="visualizer-container idle">
                        <div class="recording-info" id="recordingInfo"></div>
                        <div class="visualizer" id="visualizer"></div>
                    </div>
                    
                    <div class="status-bar">
                        <div class="status" id="status"></div>
                        <div class="stats idle" id="statsBox">
                            <span class="stat"><span class="stat-label">字数</span><span class="stat-value" id="statChars">0</span></span>
                            <span class="stat"><span class="stat-label">下次转录</span><span class="stat-value" id="statTime">0.0s</span></span>
                        </div>
                    </div>
                    
                    <div class="warmup-hint" id="warmupHint">首次转录需加载模型并预热 GPU，约需 20 秒，请稍候</div>

                    <div class="model-banner" id="modelBanner">
                        <div class="model-banner-title" id="modelBannerTitle">模型正在加载</div>
                        <div class="model-banner-bar"><div class="model-banner-fill" id="modelBannerFill"></div></div>
                        <div class="model-banner-desc" id="modelBannerDesc">正在载入识别模型权重</div>
                    </div>

                    <div class="transcripts" id="transcripts">
                        <div class="empty-stage">
                            <div class="empty-stage-title">点击上方话筒开始录音</div>
                            <div class="empty-stage-desc">文字会实时出现在这里，每隔几秒自动校准前文</div>
                        </div>
                    </div>
                    
                    <div class="error" id="error"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">录音设置</div>
            
            <div class="setting-item">
                <label class="setting-label">分段处理时长 (越短越实时)</label>
                <select class="setting-select" id="segmentDuration">
                    <option value="1500">1.5 秒 (极致实时)</option>
                    <option value="2500" selected>2.5 秒 (推荐的实时感)</option>
                    <option value="5000">5 秒 (省资源)</option>
                </select>
            </div>
            
            <div class="setting-item">
                <label class="setting-label">识别模型</label>
                <div class="setting-value" id="modelName"></div>
            </div>
            
            <div class="setting-item">
                <label class="setting-label">识别语言</label>
                <select class="setting-select" id="languageSelect">
                    <option value="zh" selected>中文 (简体)</option>
                    <option value="en">English</option>
                    <option value="auto">自动识别语种</option>
                </select>
            </div>
            
            <div class="setting-item">
                <label class="setting-checkbox">
                    <input type="checkbox" id="saveAudio" checked>
                    <span>保存音频文件</span>
                </label>
            </div>
            
            <div class="modal-footer">
                <button id="closeSettingsBtn">关闭</button>
            </div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content confirm-content">
            <div class="modal-header">请确认</div>
            <div class="confirm-text" id="confirmText"></div>
            <div class="modal-footer">
                <button id="confirmCancel">取消</button>
                <button id="confirmOk" class="danger-btn">确认删除</button>
            </div>
        </div>
    </div>
    
    <script>
        const $ = id => document.getElementById(id);

        const micButton = $('micButton');
        const status = $('status');
        const transcripts = $('transcripts');
        const errorBox = $('error');
        const toggleSidebarBtn = $('toggleSidebarBtn');
        const sidebar = document.querySelector('.sidebar');
        const sidebarScrim = $('sidebarScrim');
        const visualizer = $('visualizer');
        const visualizerBox = document.querySelector('.visualizer-container');
        const recordingInfo = $('recordingInfo');
        const historyList = $('historyList');
        const historyCount = $('historyCount');
        const searchBox = $('searchBox');
        const searchCount = $('searchCount');
        const exportAllBtn = $('exportAllBtn');
        const settingsBtn = $('settingsBtn');
        const settingsModal = $('settingsModal');
        const closeSettingsBtn = $('closeSettingsBtn');
        const segmentDurationSelect = $('segmentDuration');
        const modelName = $('modelName');
        const languageSelect = $('languageSelect');
        const saveAudioCheckbox = $('saveAudio');
        const warmupHint = $('warmupHint');
        const modelBanner = $('modelBanner');
        const modelBannerTitle = $('modelBannerTitle');
        const modelBannerFill = $('modelBannerFill');
        const modelBannerDesc = $('modelBannerDesc');
        const statChars = $('statChars');
        const statTime = $('statTime');
        const statsBox = $('statsBox');
        const confirmModal = $('confirmModal');
        const confirmText = $('confirmText');
        const confirmOk = $('confirmOk');
        const confirmCancel = $('confirmCancel');

        let mediaRecorder = null;
        let audioContext = null;
        let analyser = null;
        let stream = null;
        let segmentInterval = null;
        let audioChunks = [];
        let animationId = null;
        let segmentCount = 0;
        let currentSegmentStart = 0;
        let currentSessionId = null;
        let isRecording = false;
        let isFlipping = false;
        let errorTimer = null;
        let pendingReload = null;
        let lastStopResolve = null;

        // ---------- 通用工具 ----------
        const CJK = '\\u3000-\\u303f\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\uff00-\\uffef';
        const cjkEdge = new RegExp('[' + CJK + ']$');
        const cjkStart = new RegExp('^[' + CJK + ']');

        const UPLOAD_RETRIES = 3;
        const UPLOAD_RETRY_DELAY = 800;

        function joinText(parts) {
            let out = '';
            for (const raw of parts) {
                const part = (raw || '').trim();
                if (!part) continue;
                if (out && !(cjkEdge.test(out) && cjkStart.test(part))) out += ' ';
                out += part;
            }
            return out;
        }

        async function api(url, options) {
            const response = await fetch(url, options);
            let data = null;
            try { data = await response.json(); } catch (e) { /* 二进制响应 */ }
            if (!response.ok) {
                throw new Error((data && data.error) || ('请求失败 ' + response.status));
            }
            return data;
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.style.display = 'block';
            clearTimeout(errorTimer);
            errorTimer = setTimeout(() => { errorBox.style.display = 'none'; }, 6000);
        }

        function setStatus(text, recording = false) {
            status.textContent = text;
            status.classList.toggle('recording', recording);
        }

        function confirmAction(message) {
            return new Promise(resolve => {
                confirmText.textContent = message;
                confirmModal.classList.add('show');
                const done = value => {
                    confirmModal.classList.remove('show');
                    confirmOk.removeEventListener('click', onOk);
                    confirmCancel.removeEventListener('click', onCancel);
                    resolve(value);
                };
                const onOk = () => done(true);
                const onCancel = () => done(false);
                confirmOk.addEventListener('click', onOk);
                confirmCancel.addEventListener('click', onCancel);
            });
        }

        // ---------- 设置 ----------
        let settings = { segmentDuration: 2500, language: 'zh', saveAudio: true };

        function loadSavedSettings() {
            try {
                const saved = JSON.parse(localStorage.getItem('transcription_settings') || 'null');
                if (saved) settings = { ...settings, ...saved };
            } catch (e) { /* 存储损坏就用默认值 */ }
            delete settings.model;
            segmentDurationSelect.value = settings.segmentDuration;
            languageSelect.value = settings.language;
            saveAudioCheckbox.checked = settings.saveAudio;
        }

        function saveCurrentSettings() {
            settings = {
                segmentDuration: parseInt(segmentDurationSelect.value, 10),
                language: languageSelect.value,
                saveAudio: saveAudioCheckbox.checked
            };
            localStorage.setItem('transcription_settings', JSON.stringify(settings));
        }

        [segmentDurationSelect, languageSelect, saveAudioCheckbox]
            .forEach(el => el.addEventListener('change', saveCurrentSettings));

        // ---------- 可视化 ----------
        const BAR_COUNT = 40;
        for (let i = 0; i < BAR_COUNT; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '10px';
            visualizer.appendChild(bar);
        }
        const bars = [...visualizer.querySelectorAll('.bar')];

        // 说完即切：不靠固定定时器空等，检测到停顿就立刻上传当前片段。
        // 阈值偏保守，避免环境噪声或呼吸声把一句话切碎。
        const VAD_RMS_THRESHOLD = 0.014;
        const VAD_SILENCE_MS = 500;
        const VAD_MIN_SEGMENT_MS = 450;
        let lastVoiceAt = 0;
        let vadSegmentStart = 0;

        function resetVadClock() {
            const now = performance.now();
            lastVoiceAt = now;
            vadSegmentStart = now;
        }

        function checkVoiceEndpoint() {
            if (!isRecording || !analyser || !mediaRecorder) return;
            if (mediaRecorder.state !== 'recording') return;

            const now = performance.now();
            if (now - vadSegmentStart < VAD_MIN_SEGMENT_MS) return;

            const buf = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) {
                const x = (buf[i] - 128) / 128;
                sum += x * x;
            }
            const rms = Math.sqrt(sum / buf.length);

            if (rms > VAD_RMS_THRESHOLD) {
                lastVoiceAt = now;
                return;
            }
            if (now - lastVoiceAt < VAD_SILENCE_MS) return;

            // 停顿够久，立即封片上传，不等定时器
            mediaRecorder.stop();
            vadSegmentStart = now;
            lastVoiceAt = now;
            scheduleSegment();
        }

        function updateVisualizer() {
            if (!analyser) return;
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            const step = Math.max(1, Math.floor(data.length / BAR_COUNT));
            for (let i = 0; i < BAR_COUNT; i++) {
                const value = data[i * step];
                const height = Math.max(10, (value / 255) * 60);
                bars[i].style.height = height + 'px';
                bars[i].classList.toggle('active', value > 12);
            }
            checkVoiceEndpoint();
            const elapsed = (Date.now() - currentSegmentStart) / 1000;
            const remain = Math.max(0, settings.segmentDuration / 1000 - elapsed);
            statTime.textContent = remain.toFixed(1) + 's';
            animationId = requestAnimationFrame(updateVisualizer);
        }

        function resetVisualizer() {
            bars.forEach(bar => { bar.style.height = '10px'; bar.classList.remove('active'); });
            recordingInfo.textContent = '';
            statTime.textContent = '0.0s';
        }

        function updateStats() {
            const text = currentSessionItem ? currentSessionItem.querySelector('.transcript-text') : null;
            statChars.textContent = text ? text.textContent.replace(/\s/g, '').length : 0;
        }

        // ---------- 模型加载进度 ----------
        const PHASES = {
            idle: { title: '模型准备中', desc: '正在初始化，请稍候', progress: 10 },
            loading: { title: '模型正在加载', desc: '正在载入识别模型权重（约 1.8 GB）', progress: 35 },
            warming: { title: '模型正在预热', desc: '正在预热 GPU，首次推理约需十余秒', progress: 70 },
            ready: { title: '模型就绪', desc: '', progress: 100 },
            error: { title: '模型加载失败', desc: '', progress: 100 }
        };
        let modelReady = false;
        let modelPollTimer = null;

        function renderModelStatus(info) {
            const phase = PHASES[info.status] || PHASES.idle;
            modelBanner.classList.remove('ready', 'error');
            modelBannerTitle.textContent = phase.title;
            modelBannerFill.style.width = phase.progress + '%';
            modelBannerDesc.textContent = info.status === 'error'
                ? '错误：' + (info.error || '未知原因') + '  请查看 src/logs/transcribe_*.log'
                : phase.desc;

            if (info.status === 'ready') {
                modelReady = true;
                modelBanner.classList.add('ready');
                micButton.disabled = false;
                micButton.style.opacity = '';
                clearInterval(modelPollTimer);
                modelPollTimer = null;
                return true;
            }
            if (info.status === 'error') {
                modelReady = false;
                modelBanner.classList.add('error');
                micButton.disabled = true;
                micButton.style.opacity = '0.5';
                clearInterval(modelPollTimer);
                modelPollTimer = null;
                return true;
            }
            modelReady = false;
            return false;
        }

        function pollModelStatus() {
            fetch('/model/status')
                .then(r => r.json())
                .then(info => {
                    if (renderModelStatus(info)) return;
                    modelPollTimer = setTimeout(pollModelStatus, 600);
                })
                .catch(() => {
                    modelBannerDesc.textContent = '等待识别服务响应...';
                    modelPollTimer = setTimeout(pollModelStatus, 1200);
                });
        }

        // ---------- 录音 ----------
        async function startRecording() {
            if (isFlipping) return;
            if (!modelReady) {
                showError('模型仍在加载，请等待上方提示完成后再录音');
                return;
            }
            isFlipping = true;
            try {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e) {
                    throw new Error('无法访问麦克风：' + (e.name === 'NotAllowedError' ? '浏览器拒绝了权限请求' : e.message));
                }

                const session = await api('/session/start', { method: 'POST' });
                currentSessionId = session.session_id;
                currentSessionItem = null;
                transcripts.innerHTML = '';
                statChars.textContent = '0';

                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                audioContext.createMediaStreamSource(stream).connect(analyser);

                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                segmentCount = 0;
                currentSegmentStart = Date.now();

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    try {
                        if (audioChunks.length > 0) {
                            const blob = new Blob(audioChunks, { type: 'audio/webm' });
                            audioChunks = [];
                            try {
                                await sendAudioToServer(blob);
                            } catch (e) {
                                showError(e.message);
                            }
                        }
                    } finally {
                        if (lastStopResolve) {
                            const resolve = lastStopResolve;
                            lastStopResolve = null;
                            resolve();
                        }
                        if (isRecording) {
                            segmentCount++;
                            currentSegmentStart = Date.now();
                            resetVadClock();
                            recordingInfo.textContent = '已录制 ' + segmentCount + ' 段';
                            mediaRecorder.start();
                        }
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                micButton.classList.add('recording');
                visualizerBox.classList.remove('idle');
                statsBox.classList.remove('idle');
                languageSelect.disabled = true;
                errorBox.style.display = 'none';
                recordingInfo.textContent = '准备就绪';
                setStatus('正在录音，每 ' + (settings.segmentDuration / 1000) + ' 秒自动转录一次', true);
                resetVadClock();
                updateVisualizer();
                scheduleSegment();
            } catch (e) {
                showError(e.message);
                await teardown();
            } finally {
                isFlipping = false;
            }
        }

        function scheduleSegment() {
            clearInterval(segmentInterval);
            segmentInterval = setInterval(() => {
                if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, settings.segmentDuration);
        }

        async function stopRecording() {
            if (isFlipping || !isRecording) return;
            isFlipping = true;
            isRecording = false;
            clearInterval(segmentInterval);

            setStatus('正在处理最后一片音频...', true);

            // 先真正停掉录音器并等 onstop 里的上传完成，再收尾。
            // 否则最后一片会在 finalize 之后才落库，导致最后一句丢失。
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                await new Promise(resolve => {
                    lastStopResolve = resolve;
                    mediaRecorder.stop();
                });
            }

            const sessionId = currentSessionId;
            if (sessionId) {
                try {
                    await waitForTranscription(sessionId);
                } catch (e) {
                    showError('等待转录完成失败：' + e.message);
                }
            }

            if (sessionId) {
                try {
                    await api('/session/' + sessionId + '/finalize', { method: 'POST' });
                } catch (e) {
                    showError('收尾失败：' + e.message);
                }
            }

            await teardown();
            isFlipping = false;
            loadSessions();
        }

        async function waitForTranscription(sessionId) {
            const deadline = Date.now() + 120000;
            let lastCount = -1;
            let stable = 0;
            while (Date.now() < deadline) {
                const state = await api('/status/' + sessionId);
                if (state.segment_count === lastCount && !state.busy) {
                    stable++;
                    if (stable >= 2) return;
                } else {
                    stable = 0;
                }
                lastCount = state.segment_count;
                await new Promise(r => setTimeout(r, 300));
            }
        }

        async function teardown() {
            isRecording = false;
            clearInterval(segmentInterval);
            if (animationId) cancelAnimationFrame(animationId);
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            mediaRecorder = null;
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            analyser = null;
            micButton.classList.remove('recording');
            visualizerBox.classList.add('idle');
            statsBox.classList.add('idle');
            languageSelect.disabled = false;
            resetVisualizer();
            setStatus('');
        }

        async function sendAudioToServer(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');
            formData.append('session_id', currentSessionId);
            formData.append('language', settings.language);
            formData.append('save_audio', settings.saveAudio);

            warmupHint.style.display = 'block';
            if (isRecording) setStatus('识别中…', true);
            let lastError = null;
            try {
                for (let attempt = 1; attempt <= UPLOAD_RETRIES; attempt++) {
                    try {
                        const data = await api('/transcribe', { method: 'POST', body: formData });
                        if (data.text && data.text.trim()) {
                            updateSessionTranscript(data.session_id, data.text, data.segment_index, data.replace_start_index);
                            scheduleReload();
                        }
                        return;
                    } catch (e) {
                        lastError = e;
                        // 4xx 是请求本身有问题，重试无意义
                        if (attempt < UPLOAD_RETRIES) {
                            await new Promise(r => setTimeout(r, UPLOAD_RETRY_DELAY * attempt));
                        }
                    }
                }
                throw lastError;
            } finally {
                warmupHint.style.display = 'none';
                if (isRecording) {
                    setStatus('正在录音，每 ' + (settings.segmentDuration / 1000) + ' 秒自动转录一次', true);
                }
            }
        }

        // ---------- 主转录区 ----------
        let currentSessionItem = null;

        function updateSessionTranscript(sessionId, text, segmentIndex, replaceStartIndex) {
            let item = transcripts.querySelector('[data-session-id="' + sessionId + '"]');
            if (!item) {
                transcripts.innerHTML = '';
                item = document.createElement('div');
                item.className = 'transcript-item';
                item.dataset.sessionId = sessionId;

                const header = document.createElement('div');
                header.className = 'transcript-header';

                const time = document.createElement('div');
                time.className = 'transcript-time';
                time.textContent = '实时转录中';

                const actions = document.createElement('div');
                actions.className = 'transcript-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.textContent = '复制全部';
                copyBtn.addEventListener('click', () => {
                    copyTranscript(item.querySelector('.transcript-text').textContent, copyBtn);
                });

                actions.appendChild(copyBtn);
                header.append(time, actions);

                const textDiv = document.createElement('div');
                textDiv.className = 'transcript-text';

                item.append(header, textDiv);
                transcripts.appendChild(item);
                currentSessionItem = item;
            }

            const textDiv = item.querySelector('.transcript-text');
            if (replaceStartIndex && replaceStartIndex < segmentIndex) {
                textDiv.querySelectorAll('span').forEach(span => {
                    const seg = parseInt(span.dataset.seg, 10);
                    if (seg >= replaceStartIndex && seg < segmentIndex) span.remove();
                });
            }

            // 用不可见标记保留片段边界，展示时再按语言规则拼接
            const span = document.createElement('span');
            span.dataset.seg = segmentIndex;
            span.textContent = text;
            span.title = '片段 ' + segmentIndex;
            textDiv.appendChild(span);
            normalizeTextView(textDiv);

            updateStats();
            transcripts.scrollIntoView({ block: 'end' });
        }

        function normalizeTextView(textDiv) {
            const spans = [...textDiv.querySelectorAll('span')];
            spans.forEach((span, i) => {
                if (i === 0) {
                    span.textContent = span.textContent.replace(/^\s+/, '');
                } else {
                    const prev = spans[i - 1].textContent.trimEnd();
                    const cur = span.textContent.replace(/^\s+/, '');
                    span.textContent = (prev && cjkEdge.test(prev) && cjkStart.test(cur)) ? cur : (' ' + cur);
                }
            });
        }

        function scheduleReload() {
            clearTimeout(pendingReload);
            pendingReload = setTimeout(loadSessions, 1500);
        }

        function copyTranscript(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.textContent;
                btn.textContent = '已复制';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = original;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => showError('复制失败，请检查浏览器剪贴板权限'));
        }

        // ---------- 侧边栏 ----------
        async function loadSessions() {
            if (!historyList.children.length) renderSkeleton();
            let sessions;
            try {
                sessions = await api('/sessions');
            } catch (e) {
                historyList.innerHTML = '';
                showError('历史记录加载失败：' + e.message);
                return;
            }
            historyList.innerHTML = '';
            historyCount.textContent = sessions.length + ' 个会话';

            if (sessions.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty-hint';
                empty.textContent = '还没有录音记录';
                historyList.appendChild(empty);
                return;
            }

            const fragment = document.createDocumentFragment();
            sessions.forEach(session => fragment.appendChild(buildSessionGroup(session)));
            historyList.appendChild(fragment);
            applySearch();
        }

        function renderSkeleton() {
            historyList.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const box = document.createElement('div');
                box.className = 'skeleton';
                for (let j = 0; j < 2; j++) {
                    const line = document.createElement('div');
                    line.className = 'skeleton-line';
                    box.appendChild(line);
                }
                historyList.appendChild(box);
            }
        }

        function buildSessionGroup(session) {
            const group = document.createElement('div');
            group.className = 'session-group';
            group.dataset.sessionId = session.session_id;
            group.dataset.haystack = (session.full_text + ' ' + session.start_time + ' ' +
                (session.end_time ? '已完成' : '进行中')).toLowerCase();

            const header = document.createElement('div');
            header.className = 'session-header';

            const info = document.createElement('div');
            info.className = 'session-info';

            const title = document.createElement('div');
            title.className = 'session-title';
            const body = (session.full_text || '').trim();
            title.textContent = body ? (body.length > 20 ? body.substring(0, 20) + '…' : body) : '（空会话）';

            const meta = document.createElement('div');
            meta.className = 'session-meta';
            meta.textContent = session.start_time + ' | ' + session.segment_count + ' 段 | ' +
                session.char_count + ' 字 | ' + (session.end_time ? '已完成' : '进行中');

            info.append(title, meta);

            const actions = document.createElement('div');
            actions.className = 'session-actions';
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'session-delete-btn';
            deleteBtn.textContent = '删除';
            deleteBtn.addEventListener('click', async e => {
                e.stopPropagation();
                if (await confirmAction('删除该会话将同时移除磁盘上的音频与转录文件，且无法恢复。确认删除？')) {
                    await deleteSession(session.session_id);
                }
            });
            actions.appendChild(deleteBtn);

            header.append(info, actions);

            const segments = document.createElement('div');
            segments.className = 'session-segments';
            session.segments.forEach(segment => {
                const segItem = document.createElement('div');
                segItem.className = 'segment-item';
                const idx = document.createElement('div');
                idx.className = 'segment-index';
                idx.textContent = '片段 ' + segment.segment_index + ' - ' + (segment.time_label || '');
                const text = document.createElement('div');
                text.className = 'segment-text';
                text.textContent = segment.text || '（识别中）';
                segItem.append(idx, text);
                segItem.addEventListener('click', () => showSessionDetail(session));
                segments.appendChild(segItem);
            });

            header.addEventListener('click', () => {
                const open = segments.classList.toggle('expanded');
                if (open) showSessionDetail(session);
            });

            group.append(header, segments);
            return group;
        }

        function showSessionDetail(session) {
            transcripts.innerHTML = '';
            currentSessionItem = null;

            const item = document.createElement('div');
            item.className = 'transcript-item';
            item.dataset.sessionId = session.session_id;

            const header = document.createElement('div');
            header.className = 'transcript-header';
            const time = document.createElement('div');
            time.className = 'transcript-time';
            time.textContent = session.start_time + ' - ' + (session.end_time || '进行中') +
                ' | ' + session.segment_count + ' 段 | ' + session.char_count + ' 字';
            const actions = document.createElement('div');
            actions.className = 'transcript-actions';

            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.textContent = '复制全部';
            copyBtn.addEventListener('click', () => copyTranscript(session.full_text, copyBtn));

            const exportBtn = document.createElement('button');
            exportBtn.className = 'action-btn';
            exportBtn.textContent = '导出本段';
            exportBtn.addEventListener('click', () => exportSessions([session.session_id]));

            actions.append(copyBtn, exportBtn);
            header.append(time, actions);

            const textDiv = document.createElement('div');
            textDiv.className = 'transcript-text';
            textDiv.textContent = session.full_text || '暂无内容';

            item.append(header, textDiv);

            if (session.merged_audio) {
                const player = document.createElement('audio');
                player.className = 'audio-player';
                player.controls = true;
                player.src = '/audio/' + session.merged_audio;
                item.appendChild(player);
            }

            transcripts.appendChild(item);
        }

        async function deleteSession(sessionId) {
            try {
                await api('/session/' + sessionId, { method: 'DELETE' });
                if (currentSessionId === sessionId) currentSessionId = null;
                loadSessions();
            } catch (e) {
                showError('删除失败：' + e.message);
            }
        }

        function applySearch() {
            const query = searchBox.value.trim().toLowerCase();
            const groups = historyList.querySelectorAll('.session-group');
            let hits = 0;

            groups.forEach(group => {
                if (!query) {
                    group.style.display = 'block';
                    return;
                }
                let matched = group.dataset.haystack.includes(query);
                if (!matched) {
                    group.querySelectorAll('.segment-text').forEach(el => {
                        if (el.textContent.toLowerCase().includes(query)) matched = true;
                    });
                }
                group.style.display = matched ? 'block' : 'none';
                if (matched) {
                    hits++;
                    group.querySelector('.session-segments').classList.add('expanded');
                }
            });

            if (query) {
                if (hits === 0) {
                    searchCount.textContent = '无匹配结果';
                    searchCount.classList.add('no-hit');
                } else {
                    searchCount.textContent = hits + ' 个匹配';
                    searchCount.classList.remove('no-hit');
                }
            } else {
                searchCount.textContent = '';
                searchCount.classList.remove('no-hit');
            }
        }

        let searchTimer = null;
        searchBox.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(applySearch, 180);
        });

        async function exportSessions(sessionIds) {
            try {
                const response = await fetch('/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_ids: sessionIds })
                });
                if (!response.ok) throw new Error('导出失败 ' + response.status);
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'transcripts_' + Date.now() + '.txt';
                a.click();
                URL.revokeObjectURL(url);
            } catch (e) {
                showError(e.message);
            }
        }
        exportAllBtn.addEventListener('click', () => exportSessions([]));

        // ---------- 事件绑定 ----------
        settingsBtn.addEventListener('click', () => settingsModal.classList.add('show'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('show'));
        settingsModal.addEventListener('click', e => {
            if (e.target === settingsModal) settingsModal.classList.remove('show');
        });

        segmentDurationSelect.addEventListener('change', () => {
            if (isRecording) {
                scheduleSegment();
                setStatus('正在录音，每 ' + (settings.segmentDuration / 1000) + ' 秒自动转录一次', true);
            }
        });

        micButton.addEventListener('click', () => {
            if (isRecording) stopRecording();
            else startRecording();
        });

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            sidebarScrim.classList.toggle('show', !sidebar.classList.contains('collapsed'));
        });
        sidebarScrim.addEventListener('click', () => {
            sidebar.classList.add('collapsed');
            sidebarScrim.classList.remove('show');
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                if (isRecording) stopRecording(); else startRecording();
            }
            if (e.key === 'Escape') {
                settingsModal.classList.remove('show');
                confirmModal.classList.remove('show');
                if (isRecording) stopRecording();
            }
        });

        // ---------- 刷新/关闭保护 ----------
        // 录音中直接刷新会丢掉麦克风占用且后端会话悬空，必须拦一下
        window.addEventListener('beforeunload', e => {
            if (isRecording || isFlipping) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isRecording) {
                setStatus('页面已切到后台，录音仍在继续', true);
            }
        });

        // ---------- 启动 ----------
        // 窄屏默认折叠侧栏，否则会盖住主界面
        if (window.matchMedia('(max-width: 560px)').matches) {
            sidebar.classList.add('collapsed');
        }

        loadSavedSettings();
        loadSessions();
        pollModelStatus();
        api('/model')
            .then(d => { modelName.textContent = String(d.model).split(/[\\/]/).pop(); })
            .catch(() => { modelName.textContent = '加载失败'; });
    </script>
</script>
</body>
</html>
